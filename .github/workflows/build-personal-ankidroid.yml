name: Build Personal AnkiDroid (Auto History)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install JetBrains JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Patch native grading hook
        run: python3 custom_history/apply_patch.py

      - name: Compile debug APK
        run: |
          chmod +x gradlew
          ./gradlew :AnkiDroid:assemblePlayDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ankidroid-debug
          path: AnkiDroid/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
